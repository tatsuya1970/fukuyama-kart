  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-coast"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var plate = q(".f05coast-plate");
      var w1 = q(".f05coast-w1");
      var w2 = q(".f05coast-w2");
      var w3 = q(".f05coast-w3");
      var num = q(".f05coast-num");
      var km = q(".f05coast-km");
      var credit = q(".f05coast-credit");
      var stub = q(".f05coast-stub");
      var creditText = q(".f05coast-credit-text");

      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });

      /* --- counter proxy (value-scaled counter) ------------------------- */
      var state = { value: 0 };
      var renderValue = function () {
        num.textContent = state.value.toFixed(1);
      };
      /* baseline so a rewind always re-renders 0.0 */
      tl.to(state, { value: 0, duration: 0.001, onUpdate: renderValue }, 0);

      /* --- Scene 1 (0.0-1.0s): footage only, zero text ------------------ */
      /* nothing authored: every text layer starts at opacity 0 / scaleX 0 */

      /* --- Scene 2 (1.0-2.3s): plate, label cascade, counter ------------ */
      /* navy plate wipes in from the right edge */
      tl.fromTo(plate, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.95);

      /* per-word staggered reveal (waterfall-entry: binary opacity + y whip) */
      var t0 = 1.16;
      tl.set(w1, { opacity: 1, y: 60 }, t0);
      tl.to(w1, { y: 0, duration: 0.18, ease: "power4.out" }, t0);

      var t1 = t0 + 0.18 + 2 * F;
      tl.set(w2, { opacity: 1, y: 45 }, t1);
      tl.to(w2, { y: 0, duration: 0.15, ease: "power4.out" }, t1);

      var t2 = t1 + 0.15 - F;
      tl.set(w3, { opacity: 1, y: 40 }, t2);
      tl.to(w3, { y: 0, duration: 0.14, ease: "power4.out" }, t2);

      /* value-scaled counter: 0 -> 20.7 once; value + scale share ease and timing */
      var COUNT_AT = 1.25;
      var COUNT_DUR = 0.9;
      var COUNT_EASE = "power3.out";
      tl.set(num, { opacity: 1 }, COUNT_AT);
      tl.to(
        state,
        { value: 20.7, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: renderValue },
        COUNT_AT
      );
      tl.fromTo(num, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      /* suffix lands with the number, never during the count */
      tl.fromTo(
        km,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.34, ease: "back.out(1.6)" },
        COUNT_AT + COUNT_DUR
      );

      /* --- Scene 3 (2.3-4.0s): number held, credit fades in ------------- */
      tl.fromTo(credit, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.5);
      tl.fromTo(stub, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, 2.58);
      tl.fromTo(
        creditText,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        2.66
      );
      /* from 3.16s only the footage moves - the counter never returns. */

      window.__timelines = window.__timelines || {};
      window.__timelines["05-coast"] = tl;
      tl.seek(0);
    })();
