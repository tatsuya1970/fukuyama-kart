<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        /* assemble-index.mjs は持ち上げたフレーム動画をシーンの後ろに書き出すので、
           そのままだと DOM 順で動画が文字の上に来てしまう。動画は地なのでシーンを上に置く。
           (index.html を組み直したらこの 1 行も入れ直すこと) */
        z-index: 5;
      }
      #root > video.clip {
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-castle"
        class="scene"
        data-composition-id="01-castle"
        data-composition-src="compositions/frames/01-castle.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-eight"
        class="scene"
        data-composition-id="02-eight"
        data-composition-src="compositions/frames/02-eight.html"
        data-start="5"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-city"
        class="scene"
        data-composition-id="03-city"
        data-composition-src="compositions/frames/03-city.html"
        data-start="8.5"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-bridge"
        class="scene"
        data-composition-id="04-bridge"
        data-composition-src="compositions/frames/04-bridge.html"
        data-start="13"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-coast"
        class="scene"
        data-composition-id="05-coast"
        data-composition-src="compositions/frames/05-coast.html"
        data-start="17.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-goal"
        class="scene"
        data-composition-id="06-goal"
        data-composition-src="compositions/frames/06-goal.html"
        data-start="21.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-endcard"
        class="scene"
        data-composition-id="07-endcard"
        data-composition-src="compositions/frames/07-endcard.html"
        data-start="26.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <video id="el-01-castle-video-0" src="assets/castle.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="0"
        data-duration="5"
        data-track-index="1000"
      ></video>

      <video id="el-02-eight-video-1" src="assets/grid.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="5"
        data-duration="3.5"
        data-track-index="2000"
      ></video>

      <video id="el-03-city-video-2" src="assets/city.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="8.5"
        data-duration="4.5"
        data-track-index="3000"
      ></video>

      <video id="el-04-bridge-video-3" src="assets/bridge.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="13"
        data-duration="4.5"
        data-track-index="4000"
      ></video>

      <video id="el-05-coast-video-4" src="assets/coast.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="17.5"
        data-duration="4"
        data-track-index="5000"
      ></video>

      <video id="el-06-goal-video-5" src="assets/goal.mp4" muted
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="21.5"
        data-duration="55.5"
        data-track-index="6000"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-06-goal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.5);
        tl.fromTo("#el-07-endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.5);
        // 持ち上げられたゴールの映像はフレームの外にあるので、transitions.mjs のクロスフェードに含まれない。
        // 26.5s でぶつ切りになるのを避けるため、尺を 5.5s に伸ばして一緒に落とす。
        tl.to("#el-06-goal-video-5", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
