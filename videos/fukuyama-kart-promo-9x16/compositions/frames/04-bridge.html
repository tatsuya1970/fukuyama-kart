<template>
  <div id="root" data-composition-id="04-bridge" data-width="1080" data-height="1920">
    <style>
      @font-face {
        font-family: "Noto Sans JP";
        src: url("assets/fonts/NotoSansJP-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Noto Sans JP";
        src: url("assets/fonts/NotoSansJP-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      #root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: size;
        font-family: "Noto Sans JP", sans-serif;
      }

      /* ---- full-bleed ground: scrim over the approved footage (never on #root) ---- */
      .f04bridge-scrim {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background:
          linear-gradient(
            to bottom,
            rgba(11, 26, 42, 0.34) 0%,
            rgba(11, 26, 42, 0.06) 18%,
            rgba(11, 26, 42, 0) 46%,
            rgba(11, 26, 42, 0.28) 66%,
            rgba(11, 26, 42, 0.62) 84%,
            rgba(11, 26, 42, 0.78) 100%
          );
      }

      /* ---- nameplate: bottom band, y 67% -> 80.5% (clear of the in-game gantry sign) ---- */
      .f04bridge-plate {
        position: absolute;
        left: 0;
        top: 67%;
        width: 100%;
        height: 13.5%;
        box-sizing: border-box;
        padding: 0 6cqw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: rgba(11, 26, 42, 0.75);
        border-top: 1px solid #2b4055;
        border-bottom: 1px solid #2b4055;
      }

      .f04bridge-rule {
        width: 8cqw;
        height: 4px;
        background: #ffd83d;
        transform-origin: 0% 50%;
        margin-bottom: 1.8cqw;
      }

      .f04bridge-name {
        margin: 0;
        font-size: 9cqw;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .f04bridge-latin {
        margin-top: 1.4cqw;
        font-size: 2cqw;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c9d6e4;
      }
    </style>

    <!-- approved frame video hoisted by assemble-index -->

    <div class="clip f04bridge-scrim" data-start="0" data-duration="4.5" data-track-index="1"></div>

    <div class="clip f04bridge-plate" data-start="2.1" data-duration="2.4" data-track-index="2">
      <div class="f04bridge-rule"></div>
      <h2 class="f04bridge-name">芦田川大橋</h2>
      <div class="f04bridge-latin">Ashidagawa Ohashi Bridge</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="04-bridge"]');
        if (!root) return;

        var plate = root.querySelector(".f04bridge-plate");
        var rule = root.querySelector(".f04bridge-rule");
        var latin = root.querySelector(".f04bridge-latin");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-2.1s): footage only. No type on screen.

        // Scene 2 (2.1-3.1s): the frame's ONE move - slide-up crossfade of the nameplate
        // as the karts pass between the pylons.
        tl.fromTo(
          plate,
          { y: 58, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          2.1
        );
        tl.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.62, ease: "power3.out" },
          2.1
        );

        // Scene 3 (3.1-4.5s): the latin line fades in beneath, then everything holds.
        tl.fromTo(
          latin,
          { opacity: 0 },
          { opacity: 1, duration: 0.55, ease: "power1.out" },
          3.1
        );

        // hold to the full 4.5s
        tl.to({ v: 0 }, { v: 1, duration: 0.001, ease: "none" }, 4.499);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-bridge"] = tl;
      })();
    </script>
  </div>
</template>
