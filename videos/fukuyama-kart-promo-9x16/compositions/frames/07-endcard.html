    <script>
      (function () {
        var root = document.currentScript
          ? document.currentScript.closest('[data-composition-id="07-endcard"]')
          : document.querySelector('[data-composition-id="07-endcard"]');
        if (!root) return;

        var q = function (sel) {
          return root.querySelector(sel);
        };

        var line1 = root.querySelectorAll("#endcard07-line-1 .endcard07-chunk");
        var line2 = root.querySelectorAll("#endcard07-line-2 .endcard07-chunk");
        var ruleEl = q("#endcard07-rule");
        var subEl = q("#endcard07-sub");
        var pillEl = q("#endcard07-pill");
        var noteEl = q("#endcard07-note");

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* Scene 1 (0.00-1.05) — FUKUYAMA / KART assemble as a two-line chunk cascade */
        tl.fromTo(
          line1,
          { yPercent: 55, opacity: 0 },
          {
            yPercent: 0,
            opacity: 1,
            duration: 0.46,
            ease: "power3.out",
            stagger: 0.085
          },
          0.05
        );

        tl.fromTo(
          line2,
          { yPercent: 55, opacity: 0 },
          {
            yPercent: 0,
            opacity: 1,
            duration: 0.46,
            ease: "power3.out",
            stagger: 0.085
          },
          0.42
        );

        /* Scene 2 (1.05-1.65) — yellow rule draws from the left, then the sub-line fades up */
        tl.fromTo(
          ruleEl,
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, duration: 0.4, ease: "power2.out" },
          1.05
        );

        tl.fromTo(
          subEl,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          1.25
        );

        /* Scene 3 (1.68-2.18) — the URL plate spring-pops in (the call to action) */
        tl.fromTo(
          pillEl,
          { scale: 0.84, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.5,
            ease: "back.out(1.7)"
          },
          1.68
        );

        /* Scene 4 (2.10-2.50) — the proof line fades in, then everything is frozen */
        tl.fromTo(
          noteEl,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          2.1
        );

        /* dead-still hold 2.50 -> 3.50 (no jitter, no breathe) */
        tl.set(noteEl, { opacity: 1 }, 3.5);

        window.__timelines["07-endcard"] = tl;
      })();
