  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Ids are frame-id prefixed ("01-castle-…") so sibling frames cannot collide.

      // getElementById and hand GSAP the elements, never selector strings.
      function el(name) {
        return document.getElementById("01-castle-" + name);

      var plate = el("plate"),
        lede = el("lede"),
        w1 = el("w1"),
        w2 = el("w2"),
        rule = el("rule"),
        title = el("title"),
        label = el("label");

      // ── kinetic-beat-slam: ONE tempo grid drives every onset ──────────────

      var PULSE = 0.135; // sub-beat
      function B(n) {
        return Math.round((T0 + n * PULSE) * 1000) / 1000;
      }

      // ── Scene 2 (1.8–2.9s) — the plate wipes up from the bottom edge ──────
      tl.fromTo(
        plate,
        { scaleY: 0 },
        { scaleY: 1, duration: 0.44, ease: "power3.out" },
        B(0),
      );

      // Per-word staggered reveal — DISTINCT entrance per word, two beats apart.
      tl.fromTo(
        w1,
        { scale: 1.28, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.46, ease: "power4.out" },
        B(2),
      );
      tl.fromTo(
        w2,
        { x: -46, opacity: 0, filter: "blur(10px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        B(4),
      );

      // ── Scene 3 (2.9–3.8s) — discrete-text-sequence: the line is replaced by a
      //    hard state swap at a threshold. No fade, no slide — an instant cut. ──
      tl.set(lede, { autoAlpha: 0 }, B(8));

      // The yellow rule draws left→right on the baseline the words just left.
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out" },
        B(9),
      );

      // ── Scene 4 (3.8–5.0s) — spring-pop entrance, smooth long-tail settle ──

        title,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        B(15),
      );
      tl.fromTo(
        label,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        B(17),
      );

      // Hold the landed lockup to the end of the frame (no exit — the root owns it).
      tl.to({}, { duration: 0.455 }, 4.545);

      window.__timelines["01-castle"] = tl;
