  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-city"]');
      if (!root) return;

      var scrimTop = root.querySelector("#f03city-scrim-top");
      var scrimBottom = root.querySelector("#f03city-scrim-bottom");
      var rule = root.querySelector("#f03city-rule");
      var lineA = root.querySelector("#f03city-line-a");
      var lineB = root.querySelector("#f03city-line-b");
      var tokens = Array.prototype.slice.call(
        root.querySelectorAll("#f03city-line-a .f03city-tok")
      );
      var credit = root.querySelector("#f03city-credit");

      var DUR = 4.5;
      // one tempo grid drives every entrance (kinetic-beat-slam)
      var PULSE = 0.13;
      var S2 = 1.3; // the first line builds
      var S3 = 2.6; // hard-cut word swap
      var S4 = 3.7; // credit fades in

      var tl = gsap.timeline({ paused: true });

      // --- Scene 2 (1.3-2.6s): scrim, accent rule, per-word staggered reveal ---
      tl.fromTo(
        scrimTop,
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        S2 - 0.06
      );

      tl.fromTo(
        rule,
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.34, ease: "expo.out" },
        S2 + 0.02
      );

      var EASES = ["power4.out", "expo.out", "circ.out"];
      tokens.forEach(function (tok, i) {
        tl.fromTo(
          tok,
          { opacity: 0, y: 26, filter: "blur(14px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.44,
            ease: EASES[i % EASES.length]
          },
          S2 + 0.12 + i * PULSE
        );
      });

      // --- Scene 3 (2.6s): the signature move - instant hard-cut swap, no fade ---
      // discrete-text-sequence: whole-line states replaced at thresholds, reverse-searched.
      var STATES = [
        { t: 0.0, s: "none" },
        { t: S2, s: "a" },
        { t: S3, s: "b" }
      ];

      function stateAt(time) {
        for (var i = STATES.length - 1; i >= 0; i--) {
          if (time >= STATES[i].t) return STATES[i].s;
        }
        return "none";
      }

      function applyState(s) {
        lineA.style.display = s === "a" ? "block" : "none";
        lineB.style.display = s === "b" ? "block" : "none";
      }

      applyState("none");

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            applyState(stateAt(driver.t));
          }
        },
        0
      );

      // --- Scene 4 (3.7-4.5s): attribution fades in and holds to the last frame ---
      tl.fromTo(
        scrimBottom,
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        S4 - 0.06
      );

      tl.fromTo(
        credit,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        S4 + 0.02
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-city"] = tl;
      tl.seek(0);
    })();
  </script>
