      var root = document.querySelector('[data-composition-id="02-eight"]');
      var plate = root.querySelector('.eight-plate');
      var inner = root.querySelector('.eight-inner');
      var chips = root.querySelectorAll('.eight-chip');
      var rule = root.querySelector('.eight-rule');
      var head = root.querySelector('.eight-head');
      var label = root.querySelector('.eight-label');

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-0.9s) — grid.mp4 alone, eight karts launch. No type. */

      /* Scene 2 (0.9-2.3s) — the navy plate wipes in, then eight chips land

      tl.fromTo(
        plate,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.44, ease: 'power3.out' },
        0.9
      );

      tl.fromTo(
        chips,
        { scale: 0.24, opacity: 0, y: 28 },
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.38,
          ease: 'back.out(2.4)',
          stagger: 0.115
        },
        1.06
      );

      /* slow push-in under the assembling array (near-static hold) */
      tl.fromTo(
        inner,
        { scale: 1 },
        { scale: 1.03, duration: 2.1, ease: 'sine.out' },
        1.06
      );

      /* Scene 3 (2.3-3.5s) — on the beat the eighth chip lands: the accent
         rule draws, the count spring-pops, the label fades a half-beat later. */
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: 'power2.out' },
        2.24
      );

      tl.fromTo(
        head,
        { scale: 0.62, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: 'back.out(2.6)' },
        2.3
      );

      tl.fromTo(
        label,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.44, ease: 'power2.out' },
        2.66
      );

      /* hold the landed state to the end of the frame */
      tl.to(root, { duration: 0.001 }, 3.499);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-eight'] = tl;
      tl.seek(0);
